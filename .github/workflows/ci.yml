name: CI

# Standalone, deliberately. The house plan is thin callers of reusable
# workflows in a shared repo — that repo does not exist yet, and a `uses:`
# pointing at nothing trades drift for red CI. See template/README.md.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Root tests and typecheck import the service (shared workspace, report
      # serving, the remediation end-to-end test), so its deps must be present.
      - run: npm --prefix service ci

      # FIRST. Every later step passes against the working tree, which is
      # exactly the thing that lies when a global gitignore ate a file.
      # See standards/traps.md #1.
      - run: npm run check-tracked

      - run: npm run typecheck

      # The dependency law of plans/package-structure.md, mechanically enforced:
      # rules/ import no collector, Playwright lives only in collect/browser,
      # the Anthropic SDK only in judge/, nothing imports cli/. A PR that adds
      # `import { chromium }` inside rules/ fails to merge.
      - run: npm run boundaries

      # The browser layer's tests drive real Chromium. Install it so they run
      # here (they self-skip where it is absent, e.g. the peers matrix below).
      # --with-deps brings Playwright's font set: the glyph tests measure
      # rendered pixels, and the runner's own fonts made text rects disagree
      # with the ink (green in the Playwright image, red here).
      - run: npx playwright install --with-deps chromium

      - run: npm run build

      # After build: diff each .d.ts's value exports against the built bundle,
      # both ways. Closes test-d.ts's blind spot (a value export declared
      # type-only). See standards/traps.md #9.
      - run: npm run check-exports

      # Root tests that load the consent tool (client-banner-a11y) read
      # client/dist; without it they self-skip, which hides a regression.
      - run: npm --prefix client ci && npm --prefix client run build
      # The remediation end-to-end test drives the built service.
      - run: npm --prefix service run build

      - run: npm test

      # A host compiled to CommonJS can only `require()`, and an ESM-only
      # package fails there with ERR_REQUIRE_ESM. Prove the CJS half is real by
      # calling THROUGH it. Assert `defineConfig`: the one root export every
      # consumer touches by construction (traps #24). No import.meta.url shim
      # step — this package locates nothing on disk relative to itself (the
      # static-HTML report template is inlined, not shipped as a file), so
      # traps #7 does not apply here.
      - name: CJS entry actually loads
        run: node -e "const p=require('./dist/index.cjs'); if (typeof p.defineConfig !== 'function') process.exit(1)"

  # The consent client (client/): own package, own lockfile. Build, enforce the
  # gzipped budgets (core 15 KB, UI 12 KB), then drive a real browser over the
  # fixture pages — once per engine (F5): the banner ships to every browser, and
  # <dialog>, focus order, sendBeacon and CSP reporting differ between them.
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: client (${{ matrix.browser }})
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run size
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test
        env:
          CK_BROWSER: ${{ matrix.browser }}

  # F5: complykit's own checks on the BUILT banner, in all three engines —
  # accessibility (test/client-banner-a11y: the full Chromium browser pass, plus
  # axe-core directly in Firefox and WebKit) and the F6 banner-design rules
  # (test/banner-design: our banner read and judged in each engine).
  # COMPLYKIT_ENGINES makes every engine required: a missing browser fails the
  # job instead of skipping its suite.
  client-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm --prefix client ci && npm --prefix client run build
      - run: npx vitest run test/client-banner-a11y.test.ts test/banner-design.test.ts
        env:
          COMPLYKIT_ENGINES: chromium,firefox,webkit

  # Peer matrix (traps #10). playwright and @anthropic-ai/sdk are declared with
  # version ranges; a range is a claim and an untested claim is a lie. These
  # jobs install each peer major and run the suites that touch it. Populated as
  # the browser (M2) and judge (M4) layers land — until then the core suite is
  # peer-independent (rules are fixture-tested, judge is stubbed) and this job
  # only proves the peers install and the package imports under each.
  peers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        anthropic: ['0.30', '0.60']
    name: peers (@anthropic-ai/sdk ${{ matrix.anthropic }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --no-save keeps the lockfile authoritative for everything else.
      - run: npm install @anthropic-ai/sdk@${{ matrix.anthropic }} --no-save
      - run: npm --prefix service ci
      - run: npm run build
      - run: npm test

  # The service (service/): its own typecheck, tests and build.
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm --prefix service ci
      - run: npm run build
      - run: npm --prefix service run typecheck
      - run: npm --prefix service test
      - run: npm --prefix service run build
