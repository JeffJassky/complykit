<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Consent sample</title></head>
<body>
  <header><h1>Store</h1></header>
  <main>
    <a href="#a">Products</a>
    <button>Search</button>
    <input aria-label="email" type="email">
  </main>
  <div id="cookie-banner" role="dialog" aria-label="cookies"
       style="position:fixed;bottom:0;left:0;right:0;padding:16px;background:#222;color:#fff">
    We use cookies.
    <button style="padding:16px 32px;font-size:18px;background:#0a0">Accept all</button>
    <button style="padding:4px 8px;font-size:11px;background:#eee;color:#333">Reject</button>
  </div>
</body>
</html>
