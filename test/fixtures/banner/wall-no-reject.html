<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Banner fixture: cookie wall without reject (fail)</title>
<style>
  html, body { overflow: hidden; }
  body { margin: 0; font: 16px/1.4 sans-serif; background: #fff; color: #111; }
  main { padding: 2rem; min-height: 1600px; }
  .veil { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; }
  .consent-box { background: #fff; padding: 1.5rem; max-width: 30rem; }
  .consent-box button { font: inherit; padding: .5rem 1rem; }
</style></head>
<body>
<main><h1>Example magazine</h1><p>Article text.</p></main>
<div class="veil"><div class="consent-box" role="dialog">
  <p>This site uses cookies. You must accept cookies to continue reading.</p>
  <button>Accept</button> <button>Settings</button>
</div></div>
</body></html>
