<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Banner fixture: footer cookie-settings link (pass)</title>
<style>
  body { margin: 0; font: 16px/1.4 sans-serif; }
  .cookie-bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #000; padding: 1rem; }
  .cookie-bar button { font: inherit; padding: .5rem 1rem; min-width: 8rem; }
</style></head>
<body>
<main><h1>Example shop</h1></main>
<footer><a href="/about">About us</a> <a href="#" onclick="return false">Cookie settings</a> <a href="/privacy">Privacy policy</a></footer>
<div class="cookie-bar" id="bar">
  <p>We use cookies for analytics and advertising. You can change your choice at any time. <a href="/privacy">Privacy policy</a></p>
  <button id="no">Reject all</button> <button id="yes">Accept all</button>
</div>
<script>
  for (const id of ['no', 'yes']) document.getElementById(id).addEventListener('click', () => document.getElementById('bar').remove());
</script>
</body></html>
