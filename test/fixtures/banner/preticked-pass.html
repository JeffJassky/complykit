<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Banner fixture: categories off by default (pass)</title>
<style>
  body { margin: 0; font: 16px/1.4 sans-serif; }
  .cookie-banner { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #000; padding: 1rem; }
  #cookie-preferences { display: none; }
</style></head>
<body>
<main><h1>Example shop</h1></main>
<div class="cookie-banner">
  <p>We use cookies and similar technologies for analytics and marketing. Change your choice at any time. <a href="/privacy">Privacy</a></p>
  <button>Reject all</button> <button>Accept all</button> <button>Manage preferences</button>
  <div id="cookie-preferences" class="cookie-prefs">
    <label><input type="checkbox" checked disabled> Strictly necessary</label>
    <label><input type="checkbox"> Analytics</label>
    <label><input type="checkbox"> Marketing</label>
  </div>
</div>
</body></html>
